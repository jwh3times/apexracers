services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: apexracers
      POSTGRES_USER: apexracers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      # Host port defaults to 5432; override with POSTGRES_PORT in .env if 5432
      # is taken locally (e.g. another project's Postgres). Container always 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexracers"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apexracers.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port defaults to 8080; override with API_PORT in .env. The container
      # always listens on 8080 (matches the Azure App Service image), so this is
      # a host-only remap and never affects the deployed image.
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ADMIN_SEED_EMAILS: ${ADMIN_SEED_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: ingestion.Dockerfile
    environment:
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      IRACING_USERNAME: ${IRACING_USERNAME}
      IRACING_PASSWORD: ${IRACING_PASSWORD}
      IRACING_CLIENT_ID: ${IRACING_CLIENT_ID}
      IRACING_CLIENT_SECRET: ${IRACING_CLIENT_SECRET}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
    profiles:
      - ingestion
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
