name: Version

# Stamps every merge to main with a standard SemVer release.
#
# On each push to main this reads the release line from web/package.json `version`,
# computes the next build number for that major/minor from existing three-part SemVer tags,
# pushes an annotated tag `v<major>.<minor>.<build>`, and creates a GitHub Release.
#
# Why a tag/release instead of committing a bump back to main:
#   - it works identically on protected branches (no bypass actor or bump-commit needed);
#   - it never re-triggers CI or needs [skip ci] loops;
#   - build numbers restart whenever the major/minor line is bumped.
#
# Version source rules:
#   - web/package.json must contain a plain x.y.z SemVer version.
#   - x.y selects the release line.
#   - If no vX.Y.N three-part tag exists yet, z is accepted as the first build. This
#     intentionally allows vX.Y.0 for a major/minor bump.
#   - Once any vX.Y.N tag exists, the next merge stamps max(N)+1.
#   - Legacy four-part build tags such as v0.3.0.6 are ignored.
#
# To see which build a checkout corresponds to: git describe --tags

on:
  push:
    branches: [main]

permissions:
  contents: write # required to push the build tag

# Serialize runs so two closely-spaced merges can't compute the same build number.
concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag-build:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next build number

      - name: Compute release version, push tag, and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(jq -r .version web/package.json)
          if ! echo "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Declared version '$declared' is not a plain x.y.z SemVer version."
            exit 1
          fi

          major=$(echo "$declared" | cut -d. -f1)
          minor=$(echo "$declared" | cut -d. -f2)
          line="${major}.${minor}"

          existing_for_commit=$(
            git tag --points-at "$GITHUB_SHA" |
              grep -E "^v${major}\.${minor}\.[0-9]+$" |
              sort -t. -k3,3n |
              tail -1 || true
          )

          if [ -n "$existing_for_commit" ]; then
            tag="$existing_for_commit"
            build=$(echo "$tag" | cut -d. -f3)
            stamped="false"
          else
            # Compute the next build with the SAME script /ship uses, so the
            # version /ship predicts and the version stamped here can never drift.
            # (scripts/next-version.sh derives the x.y line from web/package.json
            # and returns x.y.<max build + 1>, or x.y.<declared build> if the line
            # has no tags yet.)
            version="$(bash scripts/next-version.sh)"
            build="${version##*.}"
            tag="v${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Computed tag '${tag}' already exists but does not point at ${GITHUB_SHA}."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
            stamped="true"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            release_created="false"
          else
            gh release create "$tag" --title "$tag" --generate-notes --latest --verify-tag
            release_created="true"
          fi

          {
            echo "### Release stamped: \`${tag}\`"
            echo ""
            echo "- Declared version: \`${declared}\`"
            echo "- Release line: \`${line}\`"
            echo "- Build number: \`${build}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag created by this run: \`${stamped}\`"
            echo "- GitHub Release created by this run: \`${release_created}\`"
          } >> "$GITHUB_STEP_SUMMARY"
