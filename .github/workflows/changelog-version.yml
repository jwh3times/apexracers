name: Changelog Version

# Verifies the branch's changelog fragments (`Scheme: stamp-on-tag`, ADR 0008). A branch writes its
# entries to its own `changelog.d/<branch-slug>.md` and never names a version: version.yml stamps
# each merge's section and tag after it lands. scripts/check-changelog.mjs fails a PR that adds,
# removes or renumbers a version section, adds entries to `## [Unreleased]`, edits or deletes a
# fragment another merge added, or adds a fragment that does not parse. A PR with no fragment
# passes: version.yml writes its section from the PR title. So Dependabot PRs need no exemption.
#
# The job keeps its name because the "Main/Release branch rules" ruleset requires
# "Verify changelog version". It is not path-filtered: a required check that never reports holds
# the merge forever.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify changelog version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, needed for the merge base with main

      - name: Verify the changelog fragments and that no released section changed
        run: node scripts/check-changelog.mjs
