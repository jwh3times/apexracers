name: Changelog Version

# Verifies that the CHANGELOG's newest section names the version this PR's merge
# will mint. It calls scripts/check-changelog.mjs, which computes that version with
# scripts/next-version.mjs — the same script version.yml uses to stamp the release,
# so the prediction and the eventual tag share one source of truth.
#
# A Dependabot PR is exempt, in the step below: the next human PR rolls its changes
# up into that PR's section. Every other PR writes a section, docs-only ones included.
#
# Blocking drift needs BOTH of these on main, and the "Main/Release branch rules"
# ruleset sets both today:
#   - "Verify changelog version" listed as a required status check, and
#   - strict_required_status_checks_policy (Require branches to be up to date).
# The second is load-bearing: `pull_request` does not re-fire when main moves, so a
# green result from before someone else's merge would otherwise stay green even
# though that merge consumed the build number this PR's section names. Requiring an
# up-to-date branch forces a `synchronize` event, which re-runs this check against
# the new tag set. Dropping either one silently reopens that gap.
#
# Note the ruleset targets branches, not tags, so version.yml's tag push is
# unaffected by it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify changelog version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next build number

      - name: Verify CHANGELOG matches the next mint version
        env:
          # The PR author, not github.actor, which is whoever triggered this run.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: exempt. The next human PR rolls up its changes."
            exit 0
          fi
          node scripts/check-changelog.mjs
