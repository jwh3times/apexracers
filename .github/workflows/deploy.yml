name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

env:
  REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # this can be removed June 16, 2026

# ── Required GitHub Secrets ───────────────────────────────────────────────────
# AZURE_CREDENTIALS       — JSON output of: az ad sp create-for-rbac --sdk-auth
# REGISTRY_LOGIN_SERVER   — e.g. apexracers.azurecr.io
# REGISTRY_USERNAME       — ACR admin username (or service principal appId)
# REGISTRY_PASSWORD       — ACR admin password (or service principal password)
# API_APP_NAME            — Azure App Service name for the API
# INGESTION_APP_NAME      — Azure Container App name for the ingestion worker
# RESOURCE_GROUP          — Azure resource group containing both resources
# ─────────────────────────────────────────────────────────────────────────────

# GITHUB_TOKEN needs only read access to repo contents — Azure auth and ACR
# pushes use dedicated secrets, not the workflow token.
permissions:
  contents: read

jobs:
  # ── Format gate — Prettier check (required status check on PRs) ──────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Check Prettier formatting
        run: npx prettier --check .
        working-directory: web

  # ── Test gate — backend + frontend tests (required status check on PRs) ──────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Run backend tests with coverage
        run: |
          dotnet test src/ApexRacers.Tests/ApexRacers.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --settings coverage.runsettings \
            --logger "console;verbosity=normal"

      # irongut/CodeCoverageSummary's fail_below_min only enforces the LINE rate.
      - name: Check backend line coverage threshold (>85%)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'coverage/**/coverage.cobertura.xml'
          fail_below_min: true
          format: text
          indicators: true
          output: console
          thresholds: '85 85'

      # The action above does not gate branch coverage, so enforce it explicitly
      # by reading branch-rate from the Cobertura report.
      - name: Check backend branch coverage threshold (>85%)
        run: |
          report=$(find coverage -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$report" ]; then
            echo "::error::No coverage.cobertura.xml found under coverage/."
            exit 1
          fi
          rate=$(grep -m1 -oE 'branch-rate="[0-9.]+"' "$report" | grep -oE '[0-9.]+')
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Backend branch coverage: ${pct}%"
          if awk -v r="$rate" 'BEGIN { exit (r >= 0.85 ? 0 : 1) }'; then
            echo "Branch coverage meets the 85% threshold."
          else
            echo "::error::Branch coverage ${pct}% is below the required 85%."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend tests with coverage (>85%)
        run: npx vitest run --coverage
        working-directory: web

  # ── API (React SPA + .NET API served from one App Service) ───────────────────
  deploy-api:
    name: Deploy API
    needs: [format, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize deploys: two closely-spaced merges to main queue instead of racing
    # (a stale image could otherwise win the App Service update).
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        run: |
          IMAGE=${{ env.REGISTRY }}/apexracers-api:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ secrets.API_APP_NAME }}
          images: ${{ env.REGISTRY }}/apexracers-api:${{ github.sha }}

  # ── Ingestion worker (Azure Container Apps) ──────────────────────────────────
  deploy-ingestion:
    name: Deploy Ingestion Worker
    needs: [format, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize deploys (same rationale as deploy-api).
    concurrency:
      group: deploy-ingestion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ingestion image
        run: |
          IMAGE=${{ env.REGISTRY }}/apexracers-ingestion:${{ github.sha }}
          docker build -f ingestion.Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ secrets.INGESTION_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/apexracers-ingestion:${{ github.sha }}
