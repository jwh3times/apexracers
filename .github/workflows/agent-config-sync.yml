name: Agent Config Sync

# Prevents drift between the authored agent/skill sources and their generated
# counterparts.
#
# `.claude/agents/*.md` is authored for Claude Code; the generator
# (`scripts/sync-agent-configs.mjs`) renders `.codex/agents/*.toml` from it for Codex.
#
# Skills run the OPPOSITE direction: `.agents/skills/<name>/**` is authored — that is
# where third-party skill installers write, so installing/updating a skill stays a
# one-way drop-in with no manual copying — and the generator mirrors the whole skill
# tree to `.claude/skills/<name>/**` for Claude Code, injecting a "GENERATED — do not
# edit" banner into each SKILL.md. Never replace that mirrored tree with a symlink:
# `git config core.symlinks` is false on a typical Windows checkout, so `git add`
# would stage the target file's contents under the link's path instead of a link
# (duplicating every file); separately, `readdirSync(..., {withFileTypes:true})`
# reports a symlink as `isSymbolicLink()`, not `isDirectory()`, so a directory-walking
# generator like this one would see zero skill sources and delete every mirrored file
# as "orphaned" on the next run.
#
# This check re-runs the generator with --check, which fails when a generated file's
# content differs from what the sources produce, or when a generated file no longer
# has a source (an orphan left behind after a rename or delete). Both cases mean
# someone edited a generated file by hand or forgot to re-run the script.
#
# The generator normalizes CRLF for text sources (agents, hooks, SKILL.md) on both
# read and compare, so a Windows working copy and a Linux runner agree; every other
# skill file (references, scripts/*.sh, agents/*.yaml, ...) is copied byte-for-byte
# with no transformation.
#
# Fix locally with:  node scripts/sync-agent-configs.mjs   (or: npm run sync:agents)
#                    then commit the result

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'scripts/sync-agent-configs.mjs'
      - '.github/workflows/agent-config-sync.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated agent config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check generated agent config matches its sources
        run: node scripts/sync-agent-configs.mjs --check
