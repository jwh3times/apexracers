name: Agent Config Sync

# Prevents drift between the authored agent/skill sources and their generated
# counterparts.
#
# `.claude/agents/*.md` is authored for Claude Code; the generator
# (`scripts/sync-agents.mjs`) renders `.codex/agents/*.toml` from it for Codex.
#
# Skills run the OPPOSITE direction: `.agents/skills/<name>/**` is authored — that is
# where third-party skill installers write, so installing/updating a skill stays a
# one-way drop-in with no manual copying — and the generator mirrors the whole skill
# tree to `.claude/skills/<name>/**` for Claude Code, injecting a "GENERATED — do not
# edit" banner into each SKILL.md. Never replace that mirrored tree with a symlink:
# `git config core.symlinks` is false on a typical Windows checkout, so `git add`
# would stage the target file's contents under the link's path instead of a link
# (duplicating every file); separately, `readdirSync(..., {withFileTypes:true})`
# reports a symlink as `isSymbolicLink()`, not `isDirectory()`, so a directory-walking
# generator like this one would see zero skill sources and delete every mirrored file
# as "orphaned" on the next run.
#
# This check re-runs the generator with --check, which fails when a generated file's
# content differs from what the sources produce, or when a generated file no longer
# has a source (an orphan left behind after a rename or delete). Both cases mean
# someone edited a generated file by hand or forgot to re-run the script.
#
# The generator normalizes CRLF when reading agent and SKILL.md sources and folds CRLF
# when comparing any non-binary generated file, so a Windows working copy and a Linux
# runner agree; every other skill file (references, scripts/*.sh, agents/*.yaml, ...)
# is written byte-for-byte with no transformation.
#
# The same job also runs the generator's node:test suite and the tool-neutrality lint
# (`scripts/lint-agent-neutrality.mjs`), which rejects blind claude->Codex substitution
# artifacts and relative links that break once a source is mirrored.
#
# Fix locally with:  node scripts/sync-agents.mjs   (or: npm run sync:agents)
#                    then commit the result

# Deliberately NOT path-filtered on pull_request. A required status check that is
# path-filtered never reports on a PR that touches none of those paths, and GitHub
# holds the merge waiting for a check that will never arrive — so the filter and the
# ruleset's required-check list are mutually exclusive. The job is a checkout, a Node
# setup, and a dependency-free script, so running it on every PR is cheap enough that
# always reporting is the better trade.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated agent config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Test the generator
        run: node --test scripts/sync-agents.test.mjs scripts/lint-agent-neutrality.test.mjs

      - name: Lint agent and skill sources for tool neutrality
        run: node scripts/lint-agent-neutrality.mjs

      - name: Check generated agent config matches its sources
        run: node scripts/sync-agents.mjs --check
