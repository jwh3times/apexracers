## Infrastructure and configuration

**Container privilege (GHSA-4whp-7hv6-jvv6)**

- Both runtime images (`Dockerfile`, `ingestion.Dockerfile`) run as the non-root `app` user
  (`USER $APP_UID`, UID 1654) rather than root.
- Test: `docker compose exec -T api id` (and the ingestion container, with `--profile ingestion`)
  must report `uid=1654(app)`, not `uid=0(root)`. A finding here (root reappearing) is a
  container-escape severity multiplier on any future RCE, not a standalone bug.
- Test: from inside the API container, attempt a write outside the app's home/mount (e.g. under
  `/app` next to the published DLLs, or elsewhere in `/`) — should fail with a permission error;
  only the Data Protection key ring path and the mounted mail drop should be writable.
- Not in scope to re-probe here: whether the `.dockerignore` entries for `.env*`/`private/` actually
  keep those paths out of the build context is a build-time property, not something reachable from a
  running container — verify it the way `docker-containers` does (a probe `COPY` build), not through
  request-based testing.

**CI/CD supply chain (GHSA-j6j2-8f7p-qv9r)**

- Every `uses:` across `.github/workflows/` is pinned to a full 40-hex commit SHA with a trailing
  `# vX.Y.Z` comment; `deploy.yml`'s two deploy jobs additionally hold `id-token: write` and exchange
  it for an Azure session that can push images and update App Service/Container Apps.
- Test: grep `.github/workflows/*.yml` for a `uses:` line without a 40-hex SHA (a version tag or
  branch name instead) — a hit reintroduces the finding this advisory closed.
- This is a repository-configuration check against the workflow files, not something reachable from a
  running container or the deployed app — report a finding here against the workflow YAML, not as an
  app-level vulnerability.
- Both deploy jobs declare `environment: production`, which is what puts `environment:production`
  (not `ref:refs/heads/main`) in the subject the Azure federated credential matches — the third
  remediation bullet of this advisory. That credential-side match can't be probed from the
  workflow file; grep confirms only that the `environment:` line is present, not that GitHub's side
  is actually restrictive. Testing it takes **two** calls (an authenticated `gh` session with
  repo-admin read, not the local dev environment) — the first reports only which *kind* of policy is
  set, never the branches:

  ```bash
  gh api repos/<owner>/<repo>/environments/production                            # expect custom_branch_policies: true
  gh api repos/<owner>/<repo>/environments/production/deployment-branch-policies # expect exactly one entry: main
  ```

  An empty or absent allowlist is the finding that matters: the credential matches the environment
  and ignores the ref, so a job on any branch could then declare the environment and mint the Azure
  token. Relying on the "protected branches" option instead is also a finding, but it fails the other
  way — this repository's `main` is protected by a **ruleset**, which that option cannot see, so it
  would match no branch and block deploys rather than admit extra ones. A finding here is a
  repository/cloud-configuration gap, not an app-level vulnerability; see the `azure-infrastructure`
  agent for why both the environment declaration and its branch allowlist are required together.

**Forwarded-header trust (GHSA-fq5w-frqr-6px2)**

- `ForwardedHeadersPolicy` owns the trust decision (`ForwardLimit = 1`, cleared
  `KnownNetworks`/`KnownProxies`); the host registers the middleware only via
  `ASPNETCORE_FORWARDEDHEADERS_ENABLED`.
- Test: send a request with a forged `X-Forwarded-For` header (e.g.
  `X-Forwarded-For: 203.0.113.77`) against a deployed instance and confirm the logged client address
  is the real one, not the forged value — `RequestLoggingMiddleware`'s line in the Application
