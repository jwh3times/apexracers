You are working with the ApexRacers container setup. Know the multi-stage build structure and Compose topology exactly.

## Two Dockerfiles at repo root

### `Dockerfile` — API + React SPA

Three stages:

1. **`frontend`** (`node:26-alpine`) — installs npm deps then builds React:

   - Copy `package.json` + `package-lock.json` first → `npm ci` → copy `web/` → `npm run build`
   - Output: `/app/dist`

2. **`api-build`** (`mcr.microsoft.com/dotnet/sdk:10.0`) — publishes the API:

   - Copy `Directory.Packages.props` first (required for central package management)
   - Copy only the three needed projects: `Core`, `Data`, `Api`
   - `dotnet publish ApexRacers.Api.csproj -c Release -o /publish --no-self-contained`
   - Output: `/publish`

3. **Runtime** (`mcr.microsoft.com/dotnet/aspnet:10.0`):
   - Copy `/publish` from api-build stage
   - Copy `/app/dist` from frontend stage → `./wwwroot`
   - `EXPOSE 8080`, `USER $APP_UID`, `ENTRYPOINT ["dotnet", "ApexRacers.Api.dll"]`

The React SPA is served from `wwwroot` in production — same origin as the API, no CORS needed.

### `ingestion.Dockerfile` — ingestion worker only

Two stages:

1. **`build`** (`mcr.microsoft.com/dotnet/sdk:10.0`):

   - Copy `Directory.Packages.props` + three projects: `Core`, `Data`, `Ingestion`
   - `dotnet publish ApexRacers.Ingestion.csproj -c Release -o /publish --no-self-contained`

2. **Runtime** (`mcr.microsoft.com/dotnet/runtime:10.0`) — **runtime only, not aspnet** (no HTTP server needed):
   - `USER $APP_UID`, `ENTRYPOINT ["dotnet", "ApexRacers.Ingestion.dll"]`

## Docker Compose (`docker-compose.yml`)

Four services:

| Service     | Image                             | Port    | Notes                                                                                                                            |
| ----------- | --------------------------------- | ------- | -------------------------------------------------------------------------------------------------------------------------------- |
| `postgres`  | `postgres:18-alpine`              | 5432    | Healthcheck: `pg_isready -U apexracers`. Volume mounts the parent dir `/var/lib/postgresql` (PG18 moved PGDATA to `…/18/docker`) |
| `pgadmin`   | `dpage/pgadmin4`                  | 5050→80 | admin@apexracers.gg / admin                                                                                                      |
| `api`       | built from `Dockerfile`           | 8080    | Depends on postgres health                                                                                                       |
| `ingestion` | built from `ingestion.Dockerfile` | —       | Profile: `ingestion`                                                                                                             |

All three published host ports (`postgres`, `pgadmin`, `api`) are bound to `127.0.0.1` in
`docker-compose.yml` (`127.0.0.1:${PORT}:...`), not all interfaces — this stack ships with default dev
credentials, Development-only conveniences, and no TLS, so it must not be reachable from the network.
Preserve this binding when editing the compose file.

The `api` service bind-mounts `./TestResults/mail` at `/app/mail` and sets `DEV_MAIL_DROP_PATH` to it.
The API writes each outbound account email there as JSON instead of delivering it, so the local E2E
loop can read the password-reset link the way a recipient would. Keep both the mount and the variable
when editing the compose file: without them the reset E2E has no way to obtain a token. Never set
`DEV_MAIL_DROP_PATH` in a deployed environment — the files hold live reset links in cleartext, and the
API deliberately refuses to start outside Development when it is set.

All services that depend on postgres use `condition: service_healthy` — the healthcheck must pass before they start.

The `ingestion` service is gated behind the `ingestion` profile:

```bash
docker compose --profile ingestion up -d   # include ingestion worker
docker compose up -d                        # postgres + pgadmin + api only
```

## `.env` file

Copy `.env.example` to `.env` at repo root before first run. Required:

- `JWT_SIGNING_KEY` — must be set, no default, and must be at least 32 UTF-8 bytes (`JwtSettings.MinimumSigningKeyBytes`) or the API refuses to start; generate one with `openssl rand -base64 48`
- `DATABASE_CONNECTION_STRING` — pre-filled for Docker network: `Host=postgres;Database=apexracers;Username=apexracers;Password=devpassword`
- `POSTGRES_PASSWORD` — defaults to `devpassword`
- `ADMIN_SEED_EMAILS` — optional comma-separated list for admin bootstrap

Ingestion-only vars (only needed with `--profile ingestion`):

- `IRACING_USERNAME`, `IRACING_PASSWORD`, `IRACING_CLIENT_ID`, `IRACING_CLIENT_SECRET`
- `INGESTION_INTERVAL_MINUTES` — defaults to 60

## Both runtime images run as non-root — keep it that way

`USER $APP_UID` (UID 1654, the `app` user the .NET images ship but do not switch to) is the last
line before each `ENTRYPOINT`, added for GHSA-4whp-7hv6-jvv6. Root in a container turns any future
RCE into a container-escape problem and every image scanner flags it. Nothing in either image needs
root: the API listens on 8080, which is unprivileged, and the worker listens on nothing.

Two consequences to respect when editing:

- **Anything the app writes at runtime must be writable by UID 1654.** Today that is
  `/home/app/.aspnet/DataProtection-Keys` (the image gives `app` a home, so this works) and the
  Compose mail drop. A new write path under `/app` will fail — the publish output is copied as
  root — so write under the user's home or a mount, not next to the DLLs.
- **A bind mount keeps the HOST directory's ownership.** `docker-compose.yml` mounts
  `./TestResults/mail` at `/app/mail`; Docker Desktop presents that as writable to any UID, but a
  Linux host does not, and UID 1654 gets EACCES. The compose file carries the fix (run that
  local-only service as the invoking user). Do not "fix" it by returning the image to root.

Verify a change to either runtime stage the way the fix was verified, not by reading it:

```bash
docker compose build api && docker compose up -d
docker compose exec -T api id                     # expect uid=1654(app)
docker compose exec -T api sh -c 'touch /app/mail/.probe && rm /app/mail/.probe'
```

## `.dockerignore` excludes local secrets, not just build noise

Beyond build output and `.git/`, it excludes `.env`, `.env.*`, `**/.env*`, `private/`, and
`TestResults/`. Neither Dockerfile copies any of them, but the context is sent to the daemon
**whole** — an excluded file cannot be pulled into an intermediate layer by a later broad `COPY`
(the frontend stage's `COPY web/ ./` is exactly that shape) and cannot sit in the daemon's context
cache. `TestResults/` matters because the Compose mail drop writes outbound account emails there as
JSON, carrying live password-reset links in cleartext.

To prove an exclusion actually holds, ask the builder rather than re-reading the file — a probe
build that tries to copy the path fails with `"/<path>": not found` when it is excluded:

```bash
printf 'FROM busybox\\nCOPY .env /probe\\n' > /tmp/probe.Dockerfile
docker build -f /tmp/probe.Dockerfile .          # expect: "/.env": not found
```

Pair it with a control that copies a path you know is in context, or a probe that fails for an
unrelated reason reads as a passing exclusion.

## Layer caching — key ordering rules

Both Dockerfiles follow this ordering pattern to maximize cache hits:

1. Copy lock files / props first (rarely change)
2. Run install / restore (expensive, should be cached)
3. Copy source (changes frequently, invalidates from here down)

When editing Dockerfiles, preserve this order. Moving a `COPY src/` before a `RUN npm ci` or `RUN dotnet publish` will break layer caching.

## Useful commands

```bash
# Build and start (with rebuild)
docker compose up -d --build

# Start with ingestion worker
docker compose --profile ingestion up -d

# Rebuild a single service
docker compose build api

# Follow API logs
docker compose logs -f api

# Connect to postgres
docker compose exec postgres psql -U apexracers -d apexracers

# Run SQL seed script
Get-Content src\\ApexRacers.Data\\Seeds\\truncate_seed_data.sql | docker compose exec -T postgres psql -U apexracers -d apexracers
```

## Base image versions

- Node: `26-alpine`
- .NET SDK: `10.0`
- .NET ASP.NET runtime: `10.0`
- .NET runtime (ingestion): `10.0`
- PostgreSQL: `18-alpine`

When updating .NET base images, update both Dockerfiles together. The SDK version must match the `<TargetFramework>net10.0</TargetFramework>` in the `.csproj` files.
