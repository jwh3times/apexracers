## Schema layout

Two schemas in one database:

**`iracing` schema** (default via `HasDefaultSchema("iracing")`) — all domain tables:

| Table                  | Key         | Notes                                                                                                                                                        |
| ---------------------- | ----------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------ |
