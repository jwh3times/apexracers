| `AuthorizedDriverNameCopies` | Guid PK | Namespace, grant ID, bounded Driver name and restricted marker FK; reads require the current grant revision, matching name authority and applicable consent |
| `ScopedDriverReferences` | SHA-256 TokenHash PK | Recipient/target grant, proof and revision bindings; purpose/provenance, original creation and at most 15-minute expiry; restricted grant FKs and expiry index |
| `PrivateDriverFollows` | Guid PK | Unique recipient/target grant pair; private provenance and original loss/reactivation/removal clocks, restricted grant FKs and removal index |
| `PrivateUploadSessions` / `PrivateUploadedLaps` | Guid PKs | Typed personal source, original verified User/Driver/provenance and restricted marker/catalog FKs; laps cascade with their source. Unique original session and Lap Number identities fence retries. |

The earlier lifecycle migration creates the six `Driver*` tables empty and renames the physical legacy claim column
to `identity.Users.ClaimedIRacingCustomerId`, preserving values and the named claim uniqueness
constraint. The C# property remains `IRacingCustomerId`. No claim is backfilled as proof or consent;
Down refuses to discard the fences/history. Driver authority requires real PostgreSQL coordination.

For legacy-upload rollback and snapshot work, use the restore boundary linked from the project
guide. A migration test must apply the real historical chain, preserve pre-cutover values, and
probe an actual prepared old reader across upgrade; `EnsureCreated` cannot establish that fence.
Independent journal/history state stays outside the primary snapshot, and reconciliation imports
original identities/clocks rather than assigning new loss times or release budgets.

**Provenance storage:** when changing Driver evidence tables, cache keys, seeding, teardown or
migrations, read docs/research/demo-acquisition-provenance.md first. Mutable evidence table names
are deliberately fenced from older binaries. Use the current EF configurations for physical
names and composite namespace keys; preserve Unknown legacy evidence and original clocks.

**Copy storage:** before changing evidence writes, dependencies, cleanup or copy-schema deployment,
read docs/research/driver-copy-writer-inventory.md. Managed cache, Field, BoP, derivative, Follow and
name rows have nullable restricted `EvidenceCopyId` FKs for unavailable legacy rows; new writes require
classified metadata. `Weeks` has separate `WeatherEvidenceCopyId` and `DemoWeatherEvidenceCopyId`
restricted FKs for its Real/Demo weather payloads. PostgreSQL triggers fence raw SQL and bulk writes,
bind marker changes to the current transaction, preserve original clocks and withdraw descendants
on source deletion or weather replacement. Markers survive payload erasure. Unknown purpose is
unavailable and reconciled by physical erasure, never inferred from a key, ID or timestamp.

**Private storage:** before changing typed uploads, dormant recovery or account erasure, read
docs/research/private-upload-lifecycle.md. Kind-8 markers bind private sources; recovery creates a
new authorized generation without changing old marker clocks. User-wide journal deletion precedes
atomic all-association closure. Minimal receipts have no User FK so account/credential erasure can
complete without dropping enforcement history; grant issuance explicitly requires a current User.
The User-delete SQL fence requires all-association closure/completion and terminal admissions before
physical account erasure. It also blocks erasure while a known primary cohort release is nonterminal
for that User as recipient or contributor; removing the receipt FK must never reopen a direct
Identity-writer bypass.

**Publication storage:** before changing composition reservations, restored accounting or cohort
writer fences, read docs/research/atomic-publication-reservations.md. `PublicationReleaseStore`
serializes with authority/copy work on advisory transaction lock `370`. Its primary tables carry
restricted enforcement metadata, not names or raw lap/rating payloads. Release identity and existing
dispatch/terminal checkpoints are immutable; dependencies cannot be updated/deleted, and their
grant binding must match the original User/Customer ID/provenance. Release deletion is fenced and
the migration refuses Down. Raw grant writes share the coordination lock and preserve the original
association; authorization openings and revision-only changes require known cohort writers to drain,
while closure can proceed to start that drain. Primary rows alone establish neither independently
current history nor restored writer terminality; production restore verification remains a separate
integration gate.

**Reference storage:** before changing reference bindings, Follow retention or their forward-only
migration, read docs/research/driver-scoped-references.md. `DriverReferenceStore` shares authority
coordination; SQL fences preserve original bindings and clocks and close dependent associations.
Legacy `ScopedRivals` do not become verified Follows. A stored hash or Follow row alone establishes
no current authority, and scheduled cleanup evidence does not certify restored backups.

**`identity` schema** — all ASP.NET Identity tables plus refresh tokens, sign-in throttle counters, and
known devices:

`Users`, `Roles`, `UserRoles`, `UserClaims`, `UserLogins`, `UserTokens`, `RoleClaims`, `RefreshTokens`,
`SignInAddressFailures`, `SignInAccountFailures`, `KnownDevices`

`ApplicationUser` extends `IdentityUser<Guid>` with `DisplayName string`, `IRacingCustomerId long?` (the user's Claimed Identity — see `docs/adr/0001-drivers-referenced-by-customer-id.md`), and `ThemePreference string`. Its Identity-owned `AccessFailedCount`/`LockoutEnd` columns still exist but are dead: sign-in brute-force protection (issue #300) reads and writes only the two tables below, not these.

`RefreshTokens`: `Id` (Guid PK), `UserId` (Guid FK → Users, cascade delete), `TokenHash` (unique index — SHA-256 hex of the raw token, raw token is never stored), `ExpiresAt`, `CreatedAt`, `RevokedAt?`. A token is active when `RevokedAt` is null and `ExpiresAt > UtcNow`.

`SignInAddressFailures` (issue #300): `Id` (Guid PK), `UserId` (Guid FK → Users, cascade delete), `IpAddress` (`varchar(56)` — sized for an IPv6 address plus a `%<scope-id>` suffix), `FailureCount`, `WindowStartedAt`, `LastFailureAt`. One row per (account, source address) pair, upserted by `SignInThrottleStore.ClaimAttemptAsync`'s raw `INSERT ... ON CONFLICT` (see Query patterns below).

`SignInAccountFailures` (issue #300): `UserId` (Guid, **both** PK and FK → Users, cascade delete — so this table cannot grow with sign-in traffic, one row per account), `FailureCount`, `WindowStartedAt`, `LastFailureAt`, `NoticeSentAt?` (paces the owner's "someone is guessing" email to one per `SignInThrottleOptions.NoticeInterval`). Read only to decide whether an account is under distributed attack — crossing the configured high-water mark tightens every unrecognized source address's allowance, it never denies a sign-in by itself.

`KnownDevices` (issue #314): `Id` (Guid PK), `UserId` (Guid FK → Users, cascade delete), `TokenHash` (`varchar(64)`, unique index — SHA-256 hex of the httpOnly cookie value, same shape as `RefreshToken.TokenHash`; raw value is never stored), `CreatedAt`, `LastSeenAt`, `ExpiresAt` (90-day lifetime from the most recent successful sign-in), `FailureCount`, `WindowStartedAt` (this device's own throttle window — same shape as `SignInAddressFailure`'s). Rows are written only after a password has actually been verified, so an unauthenticated caller cannot create one; a per-account cap of 10 evicts the least-recently-seen row on insert past the cap. Recognition (`KnownDeviceStore.RecogniseAsync`) looks this table up by `TokenHash` alone, never by `UserId`, so the lookup cost never varies with whether the caller's named account exists. Backs `Core.SignInThrottle`'s known-device exemption — a caller presenting a recognised device is throttled against this table's own counter instead of `SignInAddressFailures`.

## Persisted JSON columns hold owned Core types, not SDK types

`Weeks.WeatherSummaryJson`, `Subsessions.WeatherJson`, and `Subsessions.TrackStateJson` serialize
`ApexRacers.Core.Models.WeatherForecastSnapshot`, `WeatherSnapshot`, and `TrackStateSnapshot`, mapped
from the Aydsko SDK at ingest by the pure, tested `WeatherIngest` / `TrackStateIngest` seams — never the
raw SDK `WeatherSummary`, `ResultsWeather`, or `TrackState` types. **Their `[JsonPropertyName]` values
are pinned to the SDK's existing snake_case wire names on purpose** (`temp_value`, `wind_units`,
`leave_marbles`, `race_grip_compound`, …) so every row already on disk still deserializes; renaming one
is a persisted-contract change requiring a data migration, not a refactor. This is the pattern for any
future persisted JSON column: define an owned Core record and a pure, tested mapper (mirror
`WeatherIngest` / `TrackStateIngest` / `CatalogIngest`), then serialize only that owned shape.

## Week.Id is a Guid

`Week.Id` is application-generated (`Guid.NewGuid()`) not a database sequence. All foreign keys to
`Weeks` use `Guid`. Identity, lifecycle and copy entities also use Guid keys; consult the schema table
and current entity configuration rather than assuming every other entity uses an integer sequence.
`SignInAccountFailure` uses `UserId` itself as its PK — one row per account. Do not switch these PKs
without a migration plan.

## Critical indexes

`DriverAuthorizationGrants` is unique by `(Provenance, UserId, CustomerId)` and, for active bindings,
by `(Provenance, CustomerId)` and `(Provenance, UserId)`. `DriverPublicationAdmissions` indexes
`(GrantId, Purpose, TerminalAt)` and `Incarnation`; expiry is excluded from drain authority.
`DriverTrackedCopies` indexes `(GrantId, Purpose, UnavailableAt)`; cleanup indexes
`(VerifiedRemovedAt, DueAt)` and lifecycle work indexes `(GrantId, CompletedAt)`.

`PublicationReleases.Sequence` is globally unique and `(TerminalAt, Incarnation)` indexes active
executors. `PublicationReleaseDependencies` indexes `(UserId, CustomerId, Provenance)` and `GrantId`;
the complete history remains shared across catalog, recipient and scope changes.

`EvidencePurposes` indexes `(Provenance, Kind, SeasonId)`. `EvidenceCopyMarkers` is unique by
`(PurposeId, Kind, KeyHash, Version)` and indexes `(VerifiedRemovedAt, RemovalDueAt)` for reconciliation.
`EvidenceCopyDependencies` indexes `SourceCopyId` for descendant invalidation;
`AuthorizedDriverNameCopies` indexes `GrantId`. Managed rows and both Week weather marker FKs
are indexed by their copy IDs.

`ScopedDriverReferences` indexes `ExpiresAt` and both grant FKs. `PrivateDriverFollows` has a unique
`(RecipientGrantId, TargetGrantId)` index plus `TargetGrantId` and `RemoveBy` indexes; these support
private membership lookup, grant-loss closure and original-deadline cleanup.

`QuarantinedDataCache.CacheKey` is unique within quarantined legacy evidence; its index never authorizes a live-cache fallback.

Percentile queries use indexes on both sides of the `SubsessionResult` → `Subsession` join:

- `SubsessionResult (CarId, SubsessionId)` and `SubsessionResult (CustId)` narrow results by Car or
  Driver.
- `Subsession (WeekId)` narrows results to one persisted Week, while
  `Subsession (SeasonId, RaceWeekIndex)` supports the ApexRacers-owned zero-based Race Week lookup.
- `Week (SeasonId, RaceWeekIndex)` is unique and resolves a Race Week Index to its persisted Week ID.

`RefreshToken.TokenHash` has a unique index — lookup by hash is the only way to find a token (raw tokens are never stored).

`FeatureFlag.Key` has a unique index — enforced at DB level, not just application level.

`ExternalDataCache` has a unique index on `(Provenance, CacheKey)` (max length 200, sourced from
`ExternalDataCache.CacheKeyMaxLength`). Cache commits serialize through the copy lifecycle and
recheck their preparation receipt; stale or failed commits propagate instead of returning freshly
acquired evidence. Key factories bound caller input and `GetOrFetchAsync` rejects over-length keys
before acquisition (GHSA-jv96-89xc-98h2). A cache TTL alone does not authorize a read: current
purpose/generation and an available marker are also required.

`Rival` has a unique index on `(Provenance, UserId, RivalCustId)` — makes the follow endpoint idempotent (re-adding an existing rival is a no-op, not a duplicate row).

`ApplicationUser.IRacingCustomerId` maps to `ClaimedIRacingCustomerId`, with the preserved `IX_Users_IRacingCustomerId` unique index (`WHERE "ClaimedIRacingCustomerId" IS NOT NULL`). It enforces claim uniqueness without creating proof or consent. `AuthService` translates only PostgreSQL unique violations naming this constraint into `ClaimedIdentityConflictException` → 409.

`SeasonCarBop` has an index on `(SeasonId, RaceWeekIndex)` — backs the per-week BoP lookup from `ScheduleService`/`StrategyService`.

`SignInAddressFailure` has a unique index on `(UserId, IpAddress)` — the conflict target for `ClaimAttemptAsync`'s `INSERT ... ON CONFLICT` upsert, so two concurrent failures against the same pair land as one bumped row, not two. Both `SignInAddressFailure` and `SignInAccountFailure` also index `LastFailureAt` — the only column `SignInThrottleCleanupService`'s hourly sweep filters on.

`KnownDevice` has three indexes: a unique index on `TokenHash` (the only lookup path `KnownDeviceStore.RecogniseAsync` uses — never `UserId`, so recognition cost stays independent of account existence), a composite `(UserId, LastSeenAt)` backing the per-account 10-device cap's eviction order, and an index on `ExpiresAt` alone, which `SignInThrottleCleanupService`'s sweep filters on to drop expired devices (no grace period — unlike the failure-counter tables, recognition has genuinely lapsed the instant `ExpiresAt` passes).

When adding new query patterns in services, consider whether a new index is needed. Check the existing entity configuration first.

## EF Core entity configurations

Each entity has its own `IEntityTypeConfiguration<T>` class in `src/ApexRacers.Data/EntityConfigurations/`. They are registered via `modelBuilder.ApplyConfigurationsFromAssembly(typeof(AppDbContext).Assembly)` — no manual registration needed.

Rules:

- **Fluent API only** — no data annotations on model classes.
- Specify `OnDelete` on every relationship:
  - **Cascade** for ownership (e.g. `Rival → User`, week/season ownership) — deleting the parent removes its children.
  - **Restrict** for catalog references (anything → `Car` / `Track`) — prevent orphaned references.
  - Follow the same pattern for new entities; choose Cascade or Restrict intentionally.
- Use `HasIndex(e => new { e.A, e.B })` for composite indexes.
- Unique constraints: `HasIndex(e => e.Key).IsUnique()`.

## Migrations

The migration commands and startup behavior are in the project guide. Assess deployment compatibility
from the write contract, not only whether DDL is additive. `EvidenceCopyFencing` requires disabled,
physically purged Demo and stopped old writers before deployment. Its Down refuses to remove fences;
recovery preserves enforcement history and proceeds forward. Follow the copy-writer inventory's
cutover gates before any startup that auto-applies this migration.

## Query patterns in services

Feature services query `AppDbContext` directly via LINQ. The two service exceptions are
`SignInThrottleStore.ClaimAttemptAsync` and `KnownDeviceStore.ClaimAttemptAsync` (both below); EF has
no upsert and no `UPDATE ... RETURNING`. Lifecycle/copy modules separately own PostgreSQL coordination
and database fences; those focused boundaries do not justify raw SQL in feature services.

Key access patterns to be aware of:

- **Percentile query** (`PercentileCalculationService`): resolves `Week.Id` (Guid) via `Season` join on `SeriesId`, then queries `SubsessionResults` (joined through `Subsession`) for driver best and field distribution. The caller's `UserId` (from JWT sub) is used for cache writes and personal lap lookup; the public `customerId` (iRacing customer ID query param) is used only for race field lookup.
- **Recommendations** (`CarRecommendationService`): joins `Seasons → SeasonCars → Cars` to find cars available in a series this week, then cross-references `CarPercentileResults` for the authenticated user.
- **Analytics** (`UserAnalyticsService`): loads `CarPercentileResults` joined with `Car` and `Week` for a user's history across series.
- **CarPercentileResult writes**: Demo calculations open a `SyntheticEvidenceWriter` before reading
  contributing Fields, then save through its atomic source-version check. Check-then-insert-or-update
  alone is not an evidence write contract; ordinary Real derivative persistence remains unavailable
  until its feature authority is integrated.
- **Refresh token rotation**: consumption is a conditional `ExecuteUpdateAsync` (`Where(t => t.Id == id && t.RevokedAt == null)`, setting `RevokedAt`) rather than a tracked-entity update, so the database — not an earlier read — picks exactly one winner when two requests present the same token concurrently (GHSA-87m2-6r5g-9q47); an explicit transaction wraps that update and the new row's insert so both still land atomically. `RevokeAllActiveAsync` is likewise a set-based `ExecuteUpdateAsync`, re-run in a loop until a pass revokes zero rows rather than a single sweep, so a `RefreshToken` inserted mid-revocation is still caught.
- **Uploaded Best projection** (`UploadedBestQuery`): groups `UploadedLap` rows by `{ CarId, TrackId }` — identifiers, not the `Car.Name`/`Track.Name`/`Track.ConfigName` labels (a Track's `Name` belongs to the venue and is shared by every layout there, so a label-keyed group merges layouts the moment iRacing's labelling stops disambiguating them). Those labels still ride along via `g.First()`, and selecting them from navigation properties alongside the `Min`/`Count`/`Max` aggregates is a shape neither Npgsql nor SQLite translates. It runs `.ToListAsync()` first and groups in memory rather than pushing the `GroupBy` into SQL; the same untranslatable-shape family as the order/project-by-entity-columns-before-DTO rule in AGENTS.md's Testing section (positional-record DTO properties don't translate as `ORDER BY`/`SELECT` targets either). Follow this pattern for any new query that selects a navigation-property-derived label alongside aggregates.
- **Race Week window scoping** (`PercentileCalculationService`, `CarRecommendationService`,
  `UserAnalyticsService`): an Uploaded Lap counts toward a Personal Best only when
  `UploadedLap.RecordedAt` falls inside the Race Week's `Core.RaceWeekWindow` — `RecordedAt >= Start &&
  RecordedAt < End`, pushed into SQL as an ordinary `Where`. This range **does not translate on
  SQLite**, only on Npgsql, so tests exercising it live in `PostgreSqlCollection` classes rather than
  the fast SQLite ones — a concrete instance of the `DateTimeOffset` translation gap AGENTS.md's
  Testing section describes generally. `UserAnalyticsService` cannot push a single range into SQL because each result row belongs to a
  different Week, so it loads the caller's laps and windows once each and filters in memory instead.
- **Sign-in throttle claim** (`SignInThrottleStore.ClaimAttemptAsync`, issue #300): one of the two exceptions to the no-raw-SQL rule above. Reading a failure counter, checking a password, and writing the counter back is three steps with two gaps, and the middle step (PBKDF2) is tens of milliseconds wide — long enough for a concurrent burst to have every request read the same stale count and all pass the gate, which matters most exactly where the design leans hardest (the tightened allowance is 1). So it's a single `db.Database.SqlQueryRaw<int>` statement — `INSERT INTO identity."SignInAddressFailures" (...) VALUES (...) ON CONFLICT ("UserId", "IpAddress") DO UPDATE SET ... RETURNING "FailureCount"` — that inserts, bumps within the live window, or reopens an expired one and hands back the count it settled on in one round trip. It's read via `.ToListAsync()` rather than composed with `.Single()`: an `INSERT ... RETURNING` isn't composable, and asking EF for `Single()` would wrap it in a subquery the provider rejects. The account-wide counter (`SignInAccountFailures`) stays ordinary EF — `ExecuteUpdateAsync` for the increment, with an `InsertOrRetryAsync` fallback that catches a unique-violation on `PK_SignInAccountFailures` by name (not `DbUpdateException` at large) when two requests both find no row and race to insert one.
- **Known-device claim** (`KnownDeviceStore.ClaimAttemptAsync`, issue #314): the other exception, and the same reasoning applied to a row known to already exist (recognition already read it) rather than one that might need creating. A single `db.Database.SqlQueryRaw<int>` `UPDATE identity."KnownDevices" SET "FailureCount" = ..., "WindowStartedAt" = ... WHERE "Id" = {deviceId} AND "UserId" = {userId} RETURNING "FailureCount"` bumps within the live window or reopens an expired one, matching both `Id` and `UserId` so the storage layer enforces the same ownership invariant the in-memory check already applies — no future caller can increment another account's device by passing a mismatched pair. Also read via `.ToListAsync()` for the same non-composability reason as above; an empty result (the row vanished between recognition and the claim) is treated as "fall back to the address scope," never as a refusal.
- **Current-season / current-week resolution** (`SeasonQueries`, `src/ApexRacers.Api/Services/SeasonQueries.cs`): `AppDbContext.CurrentSeasonIdAsync` / `CurrentSeasonIdsAsync` centralize picking the *current* season — the one whose first race week began most recently, per `Core.SeasonCalendar.CurrentSeasonId` — that `ScheduleService`, `StrategyService`, `StandingsService`, `PercentileCalculationService`, `CarRecommendationService`, and `WeekCarStatsService` all query through rather than re-deriving. It is deliberately **not** `Where(Active).OrderByDescending(Year).ThenByDescending(Quarter)`: a series can have two seasons flagged active during a changeover (iRacing marks the incoming one active before it has raced), and ordering by year/quarter alone picks that upcoming, empty season while the quarter actually being raced is still current. `CurrentSeasonIdsAsync` runs two queries for a whole batch of series — season rows (id, year, quarter, active) and a grouped `MIN(Week.StartDate)` per season — then hands both to the pure rule in memory rather than expressing the tiebreak in SQL. `IQueryable<Week>.InSeason(seasonId, raceWeekIndex)` composes on an already-resolved id for the week projection. `SeriesService.GetActiveSeriesAsync` is the pattern to follow for a similar "resolve once, then query by id" reshape: active series ids, then `CurrentSeasonIdsAsync` for the whole batch, then the selected seasons, then their weeks, then `SubsessionResults` filtered to just the resolved current-week ids — with "which week is current" resolved once in memory via `Core.SeasonCalendar.CurrentRaceWeekIndex` and counts grouped in memory afterward. Prefer this shape (bulk-fetch by a resolved id set, aggregate in memory) over a `Select` whose subqueries would otherwise repeat per row.

Avoid N+1 queries. Use `.Include()` for navigation properties loaded eagerly, or project to DTOs with `.Select()` when only a subset of fields is needed.

